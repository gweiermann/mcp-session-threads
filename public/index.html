<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Session Threads</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f7f9;
        --panel: #ffffff;
        --panel-2: #f0f2f5;
        --border: #e2e5ea;
        --text: #1c2430;
        --muted: #6b7684;
        --accent: #2f6feb;
        --accent-weak: #e6efff;
        --green: #1f9d55;
        --amber: #c47f00;
        --red: #d64545;
        --shadow: 0 1px 3px rgba(20, 30, 50, 0.08), 0 4px 16px rgba(20, 30, 50, 0.06);
        --notes-w: 340px;
        --header-h: 54px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f1216;
          --panel: #181c22;
          --panel-2: #12161b;
          --border: #262d36;
          --text: #e7ecf2;
          --muted: #8a97a6;
          --accent: #4f8bff;
          --accent-weak: #17263f;
          --green: #37c26b;
          --amber: #e0a020;
          --red: #ff6b6b;
          --shadow: 0 1px 3px rgba(0, 0, 0, 0.4), 0 6px 20px rgba(0, 0, 0, 0.35);
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      /* ---- header ---- */
      header {
        position: sticky; top: 0; z-index: 30; height: var(--header-h);
        display: flex; align-items: center; gap: 12px; padding: 0 20px;
        background: color-mix(in srgb, var(--bg) 88%, transparent);
        backdrop-filter: blur(8px); border-bottom: 1px solid var(--border);
      }
      header h1 { font-size: 16px; margin: 0; font-weight: 650; }
      .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); transition: background 0.3s; }
      .dot.live { background: var(--green); box-shadow: 0 0 0 3px color-mix(in srgb, var(--green) 25%, transparent); }
      .spacer { flex: 1; }
      .counts { color: var(--muted); font-size: 13px; }
      .agent-activity { color: var(--amber); font-size: 13px; font-weight: 550; max-width: 40%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .progressbar { position: sticky; top: var(--header-h); z-index: 29; height: 4px; background: var(--panel-2); display: flex; }
      .pb-replied { height: 100%; background: color-mix(in srgb, var(--accent) 55%, transparent); transition: width 0.3s; }
      .pb-done { height: 100%; background: var(--green); transition: width 0.3s; }
      .iconbtn { background: none; border: 1px solid transparent; border-radius: 7px; cursor: pointer; font-size: 15px; padding: 2px 6px; }
      .iconbtn:hover { border-color: var(--border); }

      /* ---- layout ---- */
      .app { display: flex; align-items: flex-start; }
      #main { flex: 1; min-width: 0; padding: 20px 24px 80px; margin-right: var(--notes-w); }
      .notes {
        position: fixed; top: var(--header-h); right: 0; bottom: 0; width: var(--notes-w);
        display: flex; flex-direction: column; padding: 16px; gap: 10px;
        background: var(--panel-2); border-left: 1px solid var(--border); z-index: 20;
      }
      .notes-title { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 700; }
      .notes textarea { flex: 1; width: 100%; resize: none; font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--panel); color: var(--text); }
      .notes textarea:focus { outline: none; border-color: var(--accent); }
      .notes-hint { font-size: 12px; color: var(--muted); }
      .submit-zone { border-top: 1px solid var(--border); padding-top: 12px; display: flex; flex-direction: column; gap: 8px; }
      .submit-zone .progress { font-size: 13px; color: var(--muted); }
      .submit-zone.ready { margin: -16px; margin-top: 0; padding: 14px 16px; background: color-mix(in srgb, var(--green) 12%, var(--panel-2)); border-top: 1px solid color-mix(in srgb, var(--green) 40%, var(--border)); }
      .submit-zone.ready .progress { color: var(--green); font-weight: 650; }

      .section-title { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 22px 4px 10px; font-weight: 650; }
      .section-title:first-child { margin-top: 4px; }
      /* a <button> that reads as a section title (collapsible group header) */
      button.section-title { display: block; background: none; border: 0; padding: 0; font: inherit; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 650; color: var(--muted); cursor: pointer; }
      button.section-title:hover { color: var(--text); }
      .empty { color: var(--muted); text-align: center; padding: 40px; }

      /* ---- cards / rows ---- */
      .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px; margin-bottom: 10px; box-shadow: var(--shadow); transition: opacity 0.15s, border-color 0.15s; }
      .card.resolved { opacity: 0.55; }
      .card.replied { opacity: 0.62; }
      .card.replied:hover { opacity: 0.9; }
      .card.unread { border-left: 3px solid var(--accent); background: color-mix(in srgb, var(--accent) 4%, var(--panel)); }
      .card.unread .rtitle { font-weight: 700; }
      .card.deferred { opacity: 0.6; border-style: dashed; }
      .card.deferred:hover { opacity: 0.85; }
      .card.sel { border-color: var(--accent); box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 32%, transparent), var(--shadow); opacity: 1; }
      .keyhint { font-size: 12px; color: var(--muted); margin: 0 4px 12px; }
      .keyhint kbd { font-family: ui-monospace, Menlo, monospace; font-size: 11px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 4px; padding: 0 5px; }
      /* an <a> (so middle-click opens a new tab) but styled as the row it was */
      .row-head { display: flex; align-items: center; gap: 9px; cursor: pointer; color: inherit; text-decoration: none; }
      .row-head:hover { text-decoration: none; }
      .row-main { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 9px; }
      .dot-slot { width: 8px; flex: none; display: flex; align-self: center; }
      .rtitle { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1 1 auto; }
      .list-inner { max-width: 720px; margin: 0 auto; }
      .chip.working { background: color-mix(in srgb, var(--amber) 18%, var(--panel-2)); color: var(--amber); border: 1px solid color-mix(in srgb, var(--amber) 40%, var(--border)); }
      .chip.agentdone { background: color-mix(in srgb, var(--accent) 14%, var(--panel-2)); color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 38%, var(--border)); }
      .preview { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1 1 auto; min-width: 0; }
      .new-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); flex: none; }
      .chev { color: var(--muted); flex: none; }

      /* ---- badges / tags / chips ---- */
      .badge { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); white-space: nowrap; flex: none; }
      .badge.you { color: var(--green); border-color: color-mix(in srgb, var(--green) 40%, var(--border)); }
      .mtags { display: inline-flex; gap: 6px; flex-wrap: wrap; }
      .badge.tag-red { color: var(--red); border-color: color-mix(in srgb, var(--red) 42%, var(--border)); background: color-mix(in srgb, var(--red) 8%, transparent); }
      .badge.tag-amber { color: var(--amber); border-color: color-mix(in srgb, var(--amber) 42%, var(--border)); background: color-mix(in srgb, var(--amber) 8%, transparent); }
      .badge.tag-blue { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 42%, var(--border)); background: color-mix(in srgb, var(--accent) 8%, transparent); }
      .badge.tag-green { color: var(--green); border-color: color-mix(in srgb, var(--green) 42%, var(--border)); background: color-mix(in srgb, var(--green) 8%, transparent); }
      .badge.tag-muted { color: var(--muted); }
      .badge.tag-default { color: var(--muted); border-style: dashed; }
      .chip { font-size: 11px; font-weight: 650; padding: 2px 9px; border-radius: 999px; white-space: nowrap; flex: none; }
      .chip.replied { background: color-mix(in srgb, var(--green) 18%, var(--panel-2)); color: var(--green); border: 1px solid color-mix(in srgb, var(--green) 40%, var(--border)); }
      .chip.waiting-agent { background: color-mix(in srgb, var(--amber) 12%, var(--panel-2)); color: var(--amber); border: 1px solid color-mix(in srgb, var(--amber) 35%, var(--border)); }
      .chip.unread-chip { background: color-mix(in srgb, var(--accent) 15%, var(--panel-2)); color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 45%, var(--border)); }
      .chip.ignored { background: color-mix(in srgb, var(--red) 14%, var(--panel-2)); color: var(--red); border: 1px solid color-mix(in srgb, var(--red) 40%, var(--border)); }
      .chip.seen { background: var(--panel-2); color: var(--muted); border: 1px solid var(--border); }
      .chip.needs-input { background: color-mix(in srgb, var(--accent) 15%, var(--panel-2)); color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 45%, var(--border)); }
      .chip.deferred { background: var(--panel-2); color: var(--muted); border: 1px dashed var(--border); }
      .chip.resolved { background: var(--panel-2); color: var(--muted); border: 1px solid var(--border); }
      .section-note { color: var(--muted); font-size: 13px; padding: 2px 4px 10px; }

      /* ---- summary ---- */
      .summary { border-left: 3px solid var(--accent); background: color-mix(in srgb, var(--accent) 6%, var(--panel)); }
      .summary-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--accent); font-weight: 700; margin-bottom: 6px; }

      /* ---- done banner ---- */
      .done-banner { display: flex; align-items: center; gap: 14px; padding: 12px 16px; margin-bottom: 14px; border-radius: 12px; background: color-mix(in srgb, var(--green) 12%, var(--panel)); border: 1px solid color-mix(in srgb, var(--green) 40%, var(--border)); }
      .done-banner .txt { flex: 1; font-weight: 600; color: var(--green); }

      /* ---- detail view ---- */
      .detail-nav { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
      .detail-nav .pos { color: var(--muted); font-size: 13px; }
      .detail-nav .spacer { flex: 1; }
      .detail-card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 22px; box-shadow: var(--shadow); max-width: 780px; margin: 0 auto; }
      .detail-title { font-size: 20px; font-weight: 680; margin: 10px 0 0; }
      .detail-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      .id { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; color: var(--muted); }

      .gutter-btn { position: fixed; top: 50%; transform: translateY(-50%); z-index: 15; width: 46px; height: 92px; border-radius: 12px; border: 1px solid var(--border); background: color-mix(in srgb, var(--panel) 85%, transparent); color: var(--muted); font-size: 26px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow); backdrop-filter: blur(4px); }
      .gutter-btn:hover:not(:disabled) { color: var(--accent); border-color: var(--accent); }
      .gutter-btn:disabled { opacity: 0.3; cursor: default; }
      .gutter-prev { left: 12px; }
      .gutter-next { right: calc(var(--notes-w) + 16px); }
      .gutter-btn[hidden] { display: none; }

      /* ---- chat (detail) ---- */
      #main.detail { height: calc(100vh - var(--header-h)); padding: 0; display: flex; flex-direction: column; overflow: hidden; }
      .chat-top { display: flex; align-items: center; gap: 10px; padding: 8px 64px; flex-wrap: wrap; border-bottom: 1px solid var(--border); }
      .chat-title { font-size: 16px; font-weight: 680; margin: 0; flex: 1 1 200px; min-width: 120px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .chat-inner .detail-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
      .chat-scroll { flex: 1; overflow-y: auto; padding: 20px 64px; }
      .chat-inner { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
      .chat-inner .bubble { max-width: 80%; }
      /* agent messages read as the main content: full column width, flush left */
      .chat-inner .bubble.agent { max-width: 100%; align-self: stretch; }
      .chat-composer { border-top: 1px solid var(--border); background: var(--panel-2); padding: 12px 64px; }
      .composer-inner { max-width: 820px; margin: 0 auto; }
      .composer-inner .actions { margin-bottom: 10px; }
      .composer-input { display: flex; gap: 10px; align-items: flex-end; }
      .composer-input textarea { flex: 1; font: inherit; padding: 9px 12px; border-radius: 12px; border: 1px solid var(--border); background: var(--panel); color: var(--text); resize: none; min-height: 40px; max-height: 240px; line-height: 1.5; transition: height 0.12s ease; }
      .composer-input textarea.collapsed { height: 40px; }
      .composer-input textarea:focus { outline: none; border-color: var(--accent); }
      .composer-meta { display: flex; align-items: center; gap: 14px; margin-top: 8px; }
      .composer-meta .composer-hint { color: var(--muted); font-size: 12px; margin-left: auto; }
      .composer-collapsed { display: flex; align-items: center; gap: 12px; }
      .composer-collapsed .pending-note { color: var(--muted); font-size: 13px; }
      .pending-bubble { align-self: flex-end; max-width: 80%; padding: 8px 12px; border-radius: 14px; border: 1px dashed color-mix(in srgb, var(--accent) 55%, var(--border)); background: color-mix(in srgb, var(--accent) 9%, transparent); border-bottom-right-radius: 5px; cursor: pointer; }
      .pending-bubble:hover { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 18%, transparent); }
      .pending-cap { display: flex; align-items: center; gap: 5px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--amber); margin-bottom: 3px; }
      .reopen-note { align-self: center; font-size: 12px; color: var(--muted); background: var(--panel-2); border: 1px solid var(--border); border-radius: 999px; padding: 4px 12px; margin: 4px 0; }
      .inline-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; align-self: flex-end; margin-top: 2px; }
      .inline-actions-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }

      /* ---- bubbles ---- */
      .bubbles { margin: 14px 0 0; border-top: 1px dashed var(--border); padding-top: 14px; display: flex; flex-direction: column; gap: 8px; }
      .bubble { max-width: 85%; padding: 8px 12px; border-radius: 14px; border: 1px solid var(--border); }
      .bubble .who { display: block; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-bottom: 3px; }
      .bubble.agent { align-self: flex-start; background: var(--panel-2); border-bottom-left-radius: 5px; }
      .bubble.user { align-self: flex-end; background: var(--accent-weak); border-color: color-mix(in srgb, var(--accent) 35%, var(--border)); border-bottom-right-radius: 5px; }
      .bubble.user .who { color: var(--green); }
      /* intent hints: a "status" (still-working) message reads as an inline note, not a prompt */
      .bubble.agent.msg-status { background: transparent; border-style: dashed; color: var(--muted); }
      .bubble.agent.msg-status .who { color: var(--amber); }
      .bubble.agent.msg-done .who { color: var(--green); }
      .bubble.agent.msg-proposal .who { color: var(--accent); }

      /* ---- reply controls ---- */
      .reply { margin-top: 16px; border-top: 1px solid var(--border); padding-top: 14px; }
      .reply-label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 650; margin-bottom: 8px; }
      .actions { display: flex; flex-wrap: wrap; gap: 8px; }
      .qbtn { font: inherit; font-size: 13px; font-weight: 550; cursor: pointer; padding: 7px 13px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel-2); color: var(--text); transition: all 0.12s; }
      .qbtn:hover { border-color: var(--accent); }
      .qbtn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
      .reply textarea { width: 100%; font: inherit; padding: 9px 11px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel-2); color: var(--text); resize: vertical; margin-top: 10px; }
      .reply textarea:focus { outline: none; border-color: var(--accent); }
      .reply-row { display: flex; align-items: center; gap: 12px; margin-top: 12px; flex-wrap: wrap; }
      .resolve-check { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); cursor: pointer; }
      .reply-row .spacer { flex: 1; }
      .saved-flag { color: var(--green); font-size: 13px; font-weight: 600; }

      .btn { font: inherit; font-weight: 600; cursor: pointer; padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel-2); color: var(--text); }
      .btn:hover { border-color: var(--accent); }
      .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      .btn.ghost { background: none; }
      .btn.small { padding: 5px 11px; font-size: 13px; }
      .btn:disabled { opacity: 0.5; cursor: default; }
      .btn.primary.big { padding: 11px; font-size: 15px; width: 100%; }

      /* ---- markdown ---- */
      .md > :first-child { margin-top: 0; }
      .md > :last-child { margin-bottom: 0; }
      .md p { margin: 6px 0; }
      .md h3, .md h4, .md h5, .md h6 { margin: 10px 0 4px; font-size: 14px; font-weight: 650; }
      .md ul, .md ol { margin: 6px 0; padding-left: 20px; }
      .md li { margin: 2px 0; }
      .md a { color: var(--accent); text-decoration: none; }
      .md a:hover { text-decoration: underline; }
      .md a.file-link { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.92em; border-bottom: 1px dashed color-mix(in srgb, var(--accent) 45%, var(--border)); cursor: pointer; }
      .md a.file-link::before { content: '↗ '; opacity: 0.6; font-family: inherit; }
      .md a.thread-link { background: color-mix(in srgb, var(--accent) 10%, transparent); border: 1px solid color-mix(in srgb, var(--accent) 30%, var(--border)); border-radius: 6px; padding: 0 6px; white-space: nowrap; }
      .md a.thread-link::before { content: '💬 '; opacity: 0.7; }
      .md a.dead-link { color: var(--muted); cursor: default; text-decoration: none; }
      .md a.dead-link:hover { text-decoration: none; }
      .md blockquote { border-left: 3px solid var(--border); margin: 6px 0; padding: 2px 10px; color: var(--muted); }
      .md hr { border: 0; border-top: 1px solid var(--border); margin: 10px 0; }
      .md code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.88em; background: color-mix(in srgb, var(--muted) 16%, transparent); border: 1px solid var(--border); border-radius: 5px; padding: 0.5px 4px; }
      .md pre { background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; overflow-x: auto; margin: 8px 0; }
      .md pre code { background: none; border: 0; padding: 0; font-size: 12.5px; white-space: pre; }
      .md table { border-collapse: collapse; margin: 8px 0; font-size: 13px; display: block; overflow-x: auto; }
      .md th, .md td { border: 1px solid var(--border); padding: 4px 9px; text-align: left; }
      .md th { background: var(--panel-2); font-weight: 650; }

      .toast { position: fixed; top: 66px; left: 50%; transform: translateX(-50%); background: var(--green); color: #fff; padding: 10px 18px; border-radius: 10px; box-shadow: var(--shadow); font-size: 14px; z-index: 40; opacity: 0; transition: opacity 0.25s; pointer-events: none; }
      .toast.show { opacity: 1; }

      @media (max-width: 820px) {
        #main { margin-right: 0; padding-bottom: 20px; }
        .notes { position: static; width: auto; top: auto; }
        .gutter-btn { display: none; }
        #main.detail { height: auto; overflow: visible; padding-bottom: 20px; }
        .chat-top, .chat-header, .chat-scroll, .chat-composer { padding-left: 16px; padding-right: 16px; }
        .chat-scroll { overflow: visible; }
      }
    </style>
  </head>
  <body>
    <header>
      <span class="dot" id="dot"></span>
      <h1>Session Threads</h1>
      <span class="agent-activity" id="agentActivity"></span>
      <span class="spacer"></span>
      <span class="counts" id="counts"></span>
      <button class="iconbtn" id="fileRootBtn" title="Directory that file links open under">📁</button>
      <button class="iconbtn" id="soundBtn" title="Sound when the agent needs you or finishes">🔕</button>
    </header>
    <div class="progressbar" id="progressbar"><div class="pb-replied" id="pbReplied"></div><div class="pb-done" id="pbDone"></div></div>

    <div class="app">
      <main id="main"></main>
      <aside class="notes">
        <div class="notes-title">Other notes</div>
        <textarea id="newNotes" placeholder="Dump unrelated thoughts here anytime — questions or tasks not tied to a thread. The agent sorts these into new threads on submit."></textarea>
        <div class="notes-hint">Kept for this session; sent with your feedback on submit.</div>
        <div class="submit-zone" id="submitZone">
          <div class="progress" id="progress"></div>
          <button class="btn primary big" id="submitBtn">Submit feedback</button>
        </div>
      </aside>
    </div>

    <button class="gutter-btn gutter-prev" id="gutterPrev" hidden>‹</button>
    <button class="gutter-btn gutter-next" id="gutterNext" hidden>›</button>

    <div class="toast" id="toast"></div>

    <script type="module">
      import { mdToHtml, stripMd, escapeHtml } from '/markdown.js';
      const DEFAULT_ACTIONS = ['Fix', 'Approve'];
      const CARD_MSG_LIMIT = 3;
      // Board id from the /b/<id> path; all API calls are scoped to it.
      const BOARD = (location.pathname.match(/\/b\/([\w-]+)/) || [])[1] || '';
      const API = BOARD ? '/api/b/' + BOARD : '/api';

      let state = { version: -1, threads: [], summary: '' };
      let firstLoad = true;
      const drafts = {}; // id -> { action, text, resolve, saved }
      const edit = {}; // id -> true when the pending reply bubble is being edited
      let notes = '';
      let selIndex = 0; // keyboard-highlighted row in the list (index into open threads)
      let wantFocus = false; // focus the composer on the next detail render (set by mouse nav / the `e` key, NOT j/k)
      let keepScroll = false; // set for background re-renders: preserve the chat scroll instead of jumping to the bottom
      let prevScrollTop = 0; // chat scroll position captured just before a re-render
      const RESOLVED_KEY = 'st-resolved-open-' + BOARD;
      let resolvedOpen = localStorage.getItem(RESOLVED_KEY) === '1'; // collapsed by default
      const fullThreads = {}; // id -> full thread, lazily fetched for truncated (resolved) ones

      const $ = (id) => document.getElementById(id);
      const esc = escapeHtml;
      const actionsFor = (t) => (Array.isArray(t.actions) ? t.actions : DEFAULT_ACTIONS);

      const ts = (t) => t.updatedAt || t.createdAt || '';

      function draftFor(id) {

      const hasContent = (d) => !!(d && (d.action || (d.text && d.text.trim()) || d.resolve));
      // ---- whose turn is it? ----
      // A reply you staged locally but have NOT submitted yet.
      const isStaged = (t) => { const d = drafts[t.id]; return !!(d && d.saved && hasContent(d)); };
      const lastMsg = (t) => (t.messages && t.messages.length ? t.messages[t.messages.length - 1] : null);
      const lastAuthor = (t) => { const m = lastMsg(t); return m ? m.author : null; };
      // The agent's last message is a "status" update -> it is still working.
      const agentWorkingLast = (t) => { const m = lastMsg(t); return !!(m && m.author === 'agent' && m.intent === 'status'); };
      // Agent set a per-thread progress marker (no message): seen / working keep the
      // thread on the agent's side; the last agent message asks for input.
      const agentActive = (t) => t.work === 'seen' || t.work === 'working';
      const needsInput = (t) => { const m = lastMsg(t); return !!(m && m.author === 'agent' && (m.intent === 'question' || m.intent === 'proposal' || m.intent === 'discussion')); };
      // Agent parked it: shown in the Deferred lane, ignored by the review flow until resumed.
      const isDeferred = (t) => t.deferred === true && t.status !== 'resolved';
      const userRepliedLast = (t) => lastAuthor(t) === 'user';
      const agentTs = (f) => (state.agent && state.agent[f]) || '';
      // Your reply hasn't been picked up by the agent yet (it hasn't consumed the batch).
      const notPickedUp = (t) => userRepliedLast(t) && agentTs('consumedAt') < lastMsg(t).ts;
      // The agent picked your reply up AND then finished a round without answering
      // it. The finish must come AFTER the pickup (finishedAt >= consumedAt) —
      // otherwise a reply sent while the agent was mid-round, then picked up on its
      // next wait, would be wrongly flagged (the finish predates that pickup).
      const ignoredByAgent = (t) => {
        if (t.status === 'resolved' || isDeferred(t) || !userRepliedLast(t)) return false;
        const r = lastMsg(t).ts;
        const consumed = agentTs('consumedAt');
        return consumed >= r && agentTs('finishedAt') >= consumed;
      };
      // Ball in the AGENT's court: you replied last (and it hasn't finished without
      // answering), OR the agent posted a status update (still working).
      const awaitingAgent = (t) => t.status !== 'resolved' && !ignoredByAgent(t) && (userRepliedLast(t) || agentWorkingLast(t) || agentActive(t));
      // You've handled it (staged OR already submitted) -> not on your plate.
      const isAnswered = (t) => t.status !== 'resolved' && (awaitingAgent(t) || isStaged(t));
      // Truly needs you: open, not deferred, agent spoke last (or fresh), no staged reply.
      const needsAttention = (t) => t.status !== 'resolved' && !isDeferred(t) && !isAnswered(t);
      // "Unread" = still awaiting YOUR response. Set when the agent posts; cleared
      // ONLY when you respond (stage a reply or submit) — viewing never clears it.
      // Derived from persisted state (drafts + server messages), so it survives reloads.
      const isUnread = (t) => needsAttention(t);
      // agent-set priority wins (higher first); freshness breaks ties.
      const byPriority = (a, b) => ((b.priority || 0) - (a.priority || 0)) || byFreshest(a, b);
      // Open, non-deferred threads grouped so keyboard order == visual order: attention first.
      const openThreads = () => {
        const open = state.threads.filter((t) => t.status !== 'resolved' && !isDeferred(t));
        const attn = open.filter(needsAttention).sort(byPriority);
        const waiting = open.filter((t) => !needsAttention(t)).sort(byPriority);
        return attn.concat(waiting);
      };

      // Frozen order for the full-screen sweep. openThreads() is the LIVE
      // sorted/grouped order (list + counts). While you page through threads in
      // detail we keep the order you started with and only re-sort when you go
      // back to the overview — so replying/resolving doesn't yank the current
      // thread to another group and shift your position under you.
      let navOrder = []; // thread ids, snapshotted on each list render
      const refreshNavOrder = () => { navOrder = openThreads().map((t) => t.id); };
      function navSeq() {

        // answered (so the current thread never vanishes mid-sweep)…

      // The sequence next/prev walks depends on which LANE the current thread is in:

      function navListFor(id) {

      }

      function persistDrafts() { try { localStorage.setItem(LS_DRAFTS, JSON.stringify(drafts)); } catch {} }

      // markdown (mdToHtml / stripMd / escapeHtml) imported at top from /markdown.js

      function tagClass(tag) {

        if (/(low|minor|nit|info|note|trivial)/.test(s)) return 'tag-muted';
        if (/(question|ask|decide|discuss|clarif)/.test(s)) return 'tag-blue';

      }

        question: { label: 'question', cls: 'msg-proposal' },
        discussion: { label: 'needs discussion', cls: 'msg-proposal' },
        done: { label: '✓ done', cls: 'msg-done' },

      function bubbleEl(m) {

        b.className = 'bubble ' + (m.author === 'user' ? 'user' : 'agent');
        const meta = m.author === 'agent' && m.intent ? INTENT_META[m.intent] : null;
        if (meta) b.classList.add(meta.cls);
        else if (m.author === 'agent' && m.intent) b.classList.add('msg-proposal'); // unknown intent -> generic caption style
        const who = document.createElement('span'); who.className = 'who';
        who.textContent = m.author === 'user' ? 'you' : (m.intent ? 'agent · ' + (meta ? meta.label : m.intent) : 'agent');
        const tx = document.createElement('div'); tx.className = 'txt md'; tx.innerHTML = mdToHtml(m.text);

      }

      // ---- routing ----
      function route() { const m = location.hash.match(/^#\/t\/([\w-]+)/); return m ? { name: 'detail', id: m[1] } : { name: 'list' }; }

      const openThread = (id, focus) => { wantFocus = !!focus; go('#/t/' + id); };

      // ---- list view ----

      }
      function chip(text, cls) { const c = document.createElement('span'); c.className = 'chip ' + cls; c.textContent = text; return c; }

      function statusChip(t) {

      function renderList(main) {
        const inner = document.createElement('div'); inner.className = 'list-inner';
        main.appendChild(inner);
        if (state.summary && state.summary.trim()) {

        const waiting = open.filter((t) => !needsAttention(t));

          inner.appendChild(st1);

          }

        const nextBtn = document.createElement('button'); nextBtn.className = 'btn small'; nextBtn.textContent = '›'; nextBtn.title = 'Next (k)'; nextBtn.disabled = idx < 0 || idx >= open.length - 1; nextBtn.onclick = () => goRel(1, true); top.appendChild(nextBtn);
        main.appendChild(top);

          const dh = document.createElement('div'); dh.className = 'detail-head';
          if (t.createdBy === 'user') { const y = document.createElement('span'); y.className = 'badge you'; y.textContent = 'you'; dh.appendChild(y); }
          renderTags(dh, t);
          const idEl = document.createElement('span'); idEl.className = 'id'; idEl.textContent = t.id; dh.appendChild(idEl);

      }

      function chatBubble(author, html) {
        const b = document.createElement('div'); b.className = 'bubble ' + author;
        const who = document.createElement('span'); who.className = 'who'; who.textContent = author === 'user' ? 'you' : 'agent';
        const tx = document.createElement('div'); tx.className = 'txt md'; tx.innerHTML = html;
        b.append(who, tx); return b;
      }

      function replyText(d) {
        const parts = [];
        if (d.action) parts.push('**' + d.action + '**');
        const t = (d.text || '').trim(); if (t) parts.push(t);
        let s = parts.join(' — ');
        if (d.resolve) s += (s ? '\n\n' : '') + '_marks thread resolved_';
        return s || '_(empty)_';
      }

      function pendingBubble(t, d) {
        const b = document.createElement('div'); b.className = 'pending-bubble'; b.title = 'Click to edit';
        const cap = document.createElement('div'); cap.className = 'pending-cap'; cap.textContent = '◷ you · pending';
        const tx = document.createElement('div'); tx.className = 'txt md'; tx.innerHTML = mdToHtml(replyText(d));
        b.append(cap, tx);

      }

      // inline quick replies shown in the chat history (fresh state) — a click
      // stages AND sends immediately; the pending bubble is editable afterwards.
      function inlineActions(t) {
        const wrap = document.createElement('div'); wrap.className = 'inline-actions';
        const lbl = document.createElement('span'); lbl.className = 'inline-actions-label'; lbl.textContent = 'Quick reply';

          const b = document.createElement('button'); b.className = 'qbtn'; b.textContent = label;
          b.onclick = () => { const d = draftFor(t.id); d.action = label; persistDrafts(); saveReply(t.id); };
          wrap.appendChild(b);
        }
        return wrap;
      }

      function composer(t, idx, open, showChips) {
        const d = draftFor(t.id);
        const foot = document.createElement('div'); foot.className = 'chat-composer';
        const ci = document.createElement('div'); ci.className = 'composer-inner';

        const labels = actionsFor(t);
        if (showChips && labels.length) {
          const row = document.createElement('div'); row.className = 'actions';
          for (const label of labels) {
            const b = document.createElement('button'); b.className = 'qbtn' + (d.action === label ? ' active' : ''); b.textContent = label;
            b.onclick = () => { d.action = d.action === label ? null : label; d.saved = false; persistDrafts(); render(); };
            row.appendChild(b);
          }
          ci.appendChild(row);
        }

        const inputRow = document.createElement('div'); inputRow.className = 'composer-input';
        const ta = document.createElement('textarea'); ta.rows = 1; ta.placeholder = 'Type your reply…'; ta.value = d.text;

        const collapse = () => { ta.classList.add('collapsed'); ta.style.height = ''; };
        const expand = () => { ta.classList.remove('collapsed'); ta.style.height = 'auto'; ta.style.height = Math.min(240, Math.max(84, ta.scrollHeight)) + 'px'; };
        const sync = () => { (!ta.value.trim() && document.activeElement !== ta) ? collapse() : expand(); };
        const send = document.createElement('button'); send.className = 'btn primary'; send.textContent = edit[t.id] ? 'Update' : 'Send';
        const doSend = () => { if (!hasContent(d)) return; saveReply(t.id); };
        ta.oninput = () => { d.text = ta.value; d.saved = false; persistDrafts(); expand(); send.disabled = !hasContent(d); updateSubmitZone(); };
        ta.onfocus = expand;
        ta.onblur = () => { if (!ta.value.trim()) collapse(); };
        // plain Enter stages this thread's reply; Cmd/Ctrl+Enter falls through to
        // the global handler, which submits the whole batch.
        ta.onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.metaKey && !e.ctrlKey) { e.preventDefault(); doSend(); } };
        send.disabled = !hasContent(d); send.onclick = doSend;
        inputRow.append(ta, send);
        ci.appendChild(inputRow);

        const meta = document.createElement('div'); meta.className = 'composer-meta';
        const cl = document.createElement('label'); cl.className = 'resolve-check';
        const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = d.resolve;
        cb.onchange = () => { d.resolve = cb.checked; d.saved = false; persistDrafts(); send.disabled = !hasContent(d); };
        cl.append(cb, document.createTextNode('mark resolved')); meta.appendChild(cl);
        const hint = document.createElement('span'); hint.className = 'composer-hint'; hint.textContent = 'Enter to send · Shift+Enter newline · ⌘/Ctrl+Enter submits all'; meta.appendChild(hint);
        ci.appendChild(meta);

        foot.appendChild(ci);
        // size the textarea; only pin to the newest message when this is a real
        // open/navigation, not a background re-render while you are reading.
        const pin = !keepScroll;
        requestAnimationFrame(() => { sync(); if (pin) { const s = document.querySelector('.chat-scroll'); if (s) s.scrollTop = s.scrollHeight; } });
        return foot;
      }

      function saveReply(id, quiet) {
        const d = draftFor(id);
        if (!hasContent(d)) return;
        d.saved = true; edit[id] = false; persistDrafts();
        const open = openThreads();
        const allDone = open.length && open.every(isAnswered);
        if (!quiet) toast(allDone ? 'All threads answered — ready to submit ✓' : 'Reply staged (pending) ✓');
        render();
      }

      function maybeDoneBanner(main) {
        const open = openThreads();
        if (!open.length || !open.every(isAnswered)) return;
        const staged = open.some(isStaged);
        const b = document.createElement('div'); b.className = 'done-banner';
        b.innerHTML = `<span class="txt">${staged ? 'All threads answered.' : 'All answered — waiting on the agent.'}</span>`;
        if (staged) { const btn = document.createElement('button'); btn.className = 'btn primary'; btn.textContent = 'Submit feedback →'; btn.onclick = submit; b.appendChild(btn); }
        main.appendChild(b);
      }

      // ---- shared render ----
      function rerenderMain() { render(); }
      function render() {
        const r = route();
        // remember where the chat was scrolled before we wipe the DOM, so a
        // background re-render can put it back (see renderDetail).
        const prevScroll = document.querySelector('.chat-scroll');
        prevScrollTop = prevScroll ? prevScroll.scrollTop : 0;
        const main = $('main'); main.innerHTML = ''; main.classList.remove('detail');
        if (r.name === 'detail' && state.threads.find((x) => x.id === r.id)) {
          if (!navOrder.length) refreshNavOrder(); // baseline when deep-linking straight into a thread
          renderDetail(main, r.id);
        } else {
          refreshNavOrder(); // on the overview we (re-)snapshot the sweep order
          renderList(main);
        }
        updateHeader();
        updateSubmitZone();
        updateGutter(r);
      }

      function updateHeader() {
        const open = openThreads();
        // Your reply progress spans ONLY threads on your plate: ones needing a
        // reply + ones you've staged. Threads already submitted (awaitingAgent)
        // are the agent's court and are NOT counted here — they show separately.
        const mine = open.filter((t) => needsAttention(t) || isStaged(t));
        const mineTotal = mine.length;
        const mineReplied = mine.filter(isStaged).length;
        const withAgent = open.filter(awaitingAgent).length;
        const agentDone = open.filter((t) => t.work === 'done').length;
        const resolved = state.threads.filter((t) => t.status === 'resolved').length;
        const deferred = state.threads.filter(isDeferred).length;
        const status = (state.agent && state.agent.status) || 'idle';
        const working = status === 'working';

        // header counts + progress bar switch dimension by whose turn it is:
        // while the agent works we lead with ITS progress (green); otherwise with YOUR replies (blue).
        const parts = [];
        if (working) {
          parts.push(`⚙ agent ${agentDone}/${open.length} done`);
          if (mineTotal) parts.push(`you ${mineReplied}/${mineTotal}`);
          $('pbDone').style.width = open.length ? (agentDone / open.length) * 100 + '%' : '0%'; $('pbReplied').style.width = '0%';
        } else {
          if (mineTotal) parts.push(`${mineReplied}/${mineTotal} to reply`);
          $('pbReplied').style.width = mineTotal ? (mineReplied / mineTotal) * 100 + '%' : '0%'; $('pbDone').style.width = '0%';
        }
        if (withAgent) parts.push(`${withAgent} with agent`);
        if (resolved) parts.push(`${resolved} resolved`);
        if (deferred) parts.push(`${deferred} deferred`);
        $('counts').textContent = parts.join(' · ') || 'no threads';

        $('agentActivity').textContent = working ? '⚙ ' + (state.agent.activity || 'Working…') : (status === 'waiting' ? '🔔 waiting for your feedback' : '');
        if (typeof syncFileRootBtn === 'function') syncFileRootBtn(); // keep the 📁 title showing the effective base once state.key is known

        const allMine = mineTotal > 0 && mineReplied === mineTotal;
        if (working) document.title = `⚙ ${agentDone}/${open.length} agent — Session Threads`;
        else if (status === 'waiting' && mineTotal && !allMine) document.title = `🔔 your turn ${mineReplied}/${mineTotal} — Session Threads`;
        else if (allMine) document.title = `✅ ${mineReplied}/${mineTotal} — Session Threads`;
        else document.title = mineTotal ? `(${mineReplied}/${mineTotal}) Session Threads` : 'Session Threads';
      }

      // Navigate relative to the CURRENTLY open thread, using the frozen sweep
      // order so replying/resolving doesn't shuffle where "next"/"prev" land.
      function goRel(delta, focus) {
        const r = route(); if (r.name !== 'detail') return;
        const o = navListFor(r.id); const i = o.findIndex((x) => x.id === r.id);
        const n = o[i + delta]; if (n) openThread(n.id, !!focus);
      }

      function updateSubmitZone() {
        const open = openThreads();
        // only threads on your plate (need a reply or staged) — not ones already with the agent
        const mine = open.filter((t) => needsAttention(t) || isStaged(t));
        const mineTotal = mine.length;
        const staged = mine.filter(isStaged).length;
        // enablement counts a staged reply on ANY thread (incl. resolved reopen / deferred)
        const stagedTotal = state.threads.filter(isStaged).length;
        const allDone = mineTotal > 0 && staged === mineTotal;
        $('progress').textContent = mineTotal ? `${staged} of ${mineTotal} replied` : 'Nothing to reply to';
        $('submitZone').classList.toggle('ready', allDone && stagedTotal === staged);
        const anything = stagedTotal > 0 || notes.trim();
        $('submitBtn').disabled = !anything;
        $('submitBtn').textContent = !anything ? 'Nothing to submit' : (allDone && staged > 0 && stagedTotal === staged ? 'Submit feedback →' : 'Submit now');
      }

      function updateGutter(r) {
        const prev = $('gutterPrev'), next = $('gutterNext');
        if (r.name !== 'detail') { prev.hidden = true; next.hidden = true; return; }
        const open = navListFor(r.id);
        const idx = open.findIndex((x) => x.id === r.id);
        prev.hidden = false; next.hidden = false;
        prev.disabled = idx <= 0; next.disabled = idx < 0 || idx >= open.length - 1;
        prev.onclick = () => goRel(-1, true);
        next.onclick = () => goRel(1, true);
      }

      async function submit() {
        const replies = [];
        // collect a staged reply on ANY thread — including deferred (it un-parks)
        // and RESOLVED (a reply reopens it). Filtering these out silently dropped
        // the reply and left the thread resolved.
        for (const t of state.threads) {
          const d = drafts[t.id];
          if (d && d.saved && hasContent(d)) replies.push({ thread_id: t.id, action: d.action, text: d.text, resolve: d.resolve });
        }
        const payloadNotes = notes.trim();
        if (!replies.length && !payloadNotes) return;
        $('submitBtn').disabled = true;
        try {
          const res = await fetch(API + '/submit', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ replies, notes: payloadNotes }) });
          if (!res.ok) throw new Error('HTTP ' + res.status);
          for (const rep of replies) delete drafts[rep.thread_id];
          notes = ''; $('newNotes').value = ''; persistDrafts(); persistNotes();
          toast('Feedback sent — replied ✓');
          goList();
        } catch (e) { toast('Submit failed: ' + e.message, true); }
        finally { render(); }
      }

      let toastTimer;
      function toast(msg, err) {
        const el = $('toast'); el.textContent = msg; el.style.background = err ? 'var(--red)' : 'var(--green)';
        el.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
      }

      function applyState(next) {
        if (next.version === state.version) return;
        const prevCount = state.threads.length;
        const prevAgent = (state.agent && state.agent.status) || 'idle';
        const prevConsumed = (state.agent && state.agent.consumedAt) || '';
        // A background update re-renders the whole view, which would destroy the
        // reply <textarea> you're typing in and blur it. Capture its focus + caret
        // first, then restore them onto the freshly rendered textarea below.
        const ae = document.activeElement;
        const keepFocus = ae && ae.tagName === 'TEXTAREA' && ae.closest && ae.closest('.chat-composer');
        const caret = keepFocus ? { start: ae.selectionStart, end: ae.selectionEnd } : null;
        // background update (SSE/poll), not a user navigation -> keep the reading position
        keepScroll = !firstLoad;
        state = next; render();
        keepScroll = false;
        if (caret) {
          const ta = document.querySelector('.chat-composer textarea');
          if (ta) { ta.focus(); try { ta.setSelectionRange(caret.start, caret.end); } catch { /* ignore */ } }
        }
        if (!firstLoad) {
          if (next.threads.length > prevCount) toast('Agent posted a new thread');
          const nowAgent = (next.agent && next.agent.status) || 'idle';
          const nowConsumed = (next.agent && next.agent.consumedAt) || '';
          // TWO sounds only:
          // (1) the agent picked up a submitted batch and started working (consumedAt bumps);
          if (nowConsumed > prevConsumed) { toast('Agent picked up your feedback — working…'); beepConfirm(); }
          // (2) the agent finished the round and handed it back — only when it was
          //     actually WORKING and now hands back (waiting/done). Re-polling
          //     wait_for_feedback after a timeout goes idle -> waiting with no work
          //     done, so it stays silent (no ping every poll). done -> waiting
          //     doesn't double-ring either (prev isn't "working").
          if ((nowAgent === 'waiting' || nowAgent === 'done') && prevAgent === 'working') { toast('Agent finished — your turn ✓'); beep(); }
        }
        firstLoad = false;
      }

      // ---- file-link base (per-board override; default = board key) ----
      // Lets you point a board's relative file links at whichever checkout you
      // are actually editing (e.g. this board is keyed to shopware-2nd but you
      // are working in a different clone). Stored in the browser, per board.
      const FILEROOT_KEY = 'st-fileroot-' + BOARD;
      let fileRoot = localStorage.getItem(FILEROOT_KEY) || '';
      function syncFileRootBtn() {
        const eff = fileRoot || (state && state.key) || '(unknown)';
        $('fileRootBtn').textContent = fileRoot ? '📂' : '📁';
        $('fileRootBtn').title = 'File links open under: ' + eff + (fileRoot ? '  (overridden — click to change)' : '  (board default — click to override)');
      }

      // ---- sound (per-board toggle, default off) ----
      const SND_KEY = 'rt-sound-' + BOARD;
      let soundOn = localStorage.getItem(SND_KEY) === '1';
      function syncSoundBtn() { $('soundBtn').textContent = soundOn ? '🔔' : '🔕'; $('soundBtn').title = soundOn ? 'Sound on — plays when the agent picks up your feedback and when it hands the round back to you' : 'Sound off — click to enable the two round sounds (picked up / your turn)'; }
      // ONE shared AudioContext. Browser autoplay policy suspends audio until a
      // user gesture *this page-load* — and the bell state is persisted, so after a
      // reload it can read 🔔 while audio is still locked. We create the context
      // lazily and resume it on the first user gesture (below), then reuse it; a
      // beep triggered later by an SSE event therefore plays instead of landing on
      // a fresh suspended context.
      let audioCtx = null;
      function getAudio() {
        if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { audioCtx = null; } }
        return audioCtx;
      }
      function unlockAudio() { const ac = getAudio(); if (ac && ac.state === 'suspended') ac.resume().catch(() => {}); }
      // play one or more sine blips; each note is [frequency, startOffsetSec, durationSec]
      function playTones(notes) {
        if (!soundOn) return;
        const ac = getAudio(); if (!ac) return;
        const emit = () => {
          try {
            for (const [freq, at, dur] of notes) {
              const o = ac.createOscillator(), g = ac.createGain();
              o.connect(g); g.connect(ac.destination); o.type = 'sine'; o.frequency.value = freq;
              const t0 = ac.currentTime + at;
              g.gain.setValueAtTime(0.001, t0); g.gain.exponentialRampToValueAtTime(0.15, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
              o.start(t0); o.stop(t0 + dur + 0.01);
            }
          } catch { /* ignore */ }
        };
        if (ac.state === 'suspended') ac.resume().then(emit).catch(emit); else emit();
      }
      // your-turn / finished: a single clear high tone
      function beep() { playTones([[880, 0, 0.35]]); }
      // feedback synced: a quick two-note rising acknowledgement (distinct from the your-turn ping)
      function beepConfirm() { playTones([[587, 0, 0.12], [880, 0.12, 0.16]]); }

      function connect() {
        const es = new EventSource(API + '/events');
        es.onopen = () => $('dot').classList.add('live');
        es.onerror = () => $('dot').classList.remove('live');
        es.onmessage = (ev) => { try { const m = JSON.parse(ev.data); if (m.type === 'state') applyState(m.state); } catch {} };
      }
      async function refresh() { try { const r = await fetch(API + '/state'); applyState(await r.json()); } catch {} }

      // ---- file links (markdown [text](path[:line[:col]])) ----
      // Open the file in the editor via the vscode:// scheme. Relative paths
      // resolve against the file base (board key by default, overridable via 📁).
      // Use a real anchor click within the user's click gesture: an <iframe>.src
      // only *activates* the editor without reliably delivering the deep-link
      // payload (opens the app but not the file/line), whereas a top-level click
      // passes the full path+line to the OS handler.
      function openExternal(url) {
        const a = document.createElement('a');
        a.href = url; a.rel = 'noopener'; a.style.display = 'none';
        document.body.appendChild(a);
        a.click();
        setTimeout(() => { try { a.remove(); } catch {} }, 1000);
      }
      function fileBase() { return (fileRoot || (state && state.key) || '').replace(/\/+$/, ''); }
      function handleFileLink(raw) {
        let file = raw, line = '', col = '';
        const mm = raw.match(/^(.*?):(\d+)(?::(\d+))?$/); // split path:line[:col]
        if (mm) { file = mm[1]; line = mm[2]; col = mm[3] || ''; }
        const key = fileBase(); // board key by default; overridable per board (see 📁)
        let abs = file;
        if (!file.startsWith('/')) abs = key ? key + '/' + file.replace(/^\.?\//, '') : '';
        if (abs) {
          openExternal('vscode://file' + abs + (line ? ':' + line + (col ? ':' + col : '') : ''));
          toast('Opening ' + file + ' in VS Code');
        } else {
          toast('No base directory set — click 📁 to choose where file links open', true);
        }
      }

      // focus the reply input for the current thread (opening the pending
      // reply for editing if it's collapsed into a bubble)
      function focusComposer(id) {
        const ta = document.querySelector('.composer-input textarea');
        if (ta) { ta.focus(); ta.selectionStart = ta.selectionEnd = ta.value.length; return; }
        if (id) { wantFocus = true; edit[id] = true; render(); }
      }
      function scrollSelIntoView() { const el = document.querySelector('.card.sel'); if (el) el.scrollIntoView({ block: 'nearest' }); }
      function scrollChat(dir) { const s = document.querySelector('.chat-scroll'); if (s) s.scrollBy({ top: dir * Math.round(s.clientHeight * 0.5), behavior: 'smooth' }); }

      // Fetch the full content of a thread that came through truncated, then
      // re-render if the user is still looking at it.
      async function loadFullThread(id, version) {
        if (loadingFull[id]) return;
        loadingFull[id] = true;
        try {
          const res = await fetch(API + '/thread/' + id);
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const j = await res.json();
          if (j.thread) {
            fullThreads[id] = j.thread;
            const r = route();
            if (r.name === 'detail' && r.id === id) { keepScroll = false; render(); }
          }
        } catch (e) {
          toast('Could not load this thread: ' + e.message, true);
        } finally {
          loadingFull[id] = false;
        }
      }

      // un-park a deferred thread immediately (server write, not staged)
      async function undefer(id) {
        try {
          const res = await fetch(API + '/defer', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ thread_id: id, deferred: false }) });
          if (!res.ok) throw new Error('HTTP ' + res.status);
          toast('Un-deferred — back in the active review ✓');
          refresh();
        } catch (e) { toast('Could not un-defer: ' + e.message, true); }
      }

      // stage a resolve on a thread's reply (sent on submit); toggles
      function toggleResolve(id) {
        const d = draftFor(id);
        d.resolve = !d.resolve;
        d.saved = hasContent(d);
        persistDrafts();
        toast(d.resolve ? 'Marked resolved (staged for submit) ✓' : 'Resolve unmarked');
        render();
      }

      // ---- keyboard shortcuts ----
      // k = next thread · j = previous · h/l = scroll chat up/down · e = reply
      // · r = resolve · Enter = open (list) / send-or-focus (thread) · Esc = leave
      function onKey(e) {
        const t = e.target;
        const inField = t && (t.tagName === 'TEXTAREA' || t.tagName === 'INPUT' || t.isContentEditable);
        // ⌘/Ctrl+Enter submits the whole feedback batch from anywhere. If you're
        // mid-typing a reply, stage it first so it's included.
        if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
          e.preventDefault();
          const r = route();
          if (r.name === 'detail') { const d = drafts[r.id]; if (d && hasContent(d) && !d.saved) saveReply(r.id, true); }
          if (!$('submitBtn').disabled) submit();
          return;
        }
        if (e.key === 'Escape') {
          if (inField) { t.blur(); e.preventDefault(); }
          else if (route().name === 'detail') { goList(); e.preventDefault(); }
          return;
        }
        if (inField || e.metaKey || e.ctrlKey || e.altKey) return;
        if (e.key === 'Enter' && t && t.tagName === 'BUTTON') return; // let buttons activate
        const r = route();
        if (r.name === 'detail') {
          if (e.key === 'k') { goRel(1, false); e.preventDefault(); }       // k = next (no focus steal)
          else if (e.key === 'j') { goRel(-1, false); e.preventDefault(); }  // j = previous (no focus steal)
          else if (e.key === 'l') { scrollChat(1); e.preventDefault(); }   // l = scroll down
          else if (e.key === 'h') { scrollChat(-1); e.preventDefault(); }  // h = scroll up
          else if (e.key === 'r') { toggleResolve(r.id); e.preventDefault(); }
          else if (e.key === 'e') { focusComposer(r.id); e.preventDefault(); }
          else if (e.key === 'Enter') {
            const ta = document.querySelector('.composer-input textarea');
            const d = drafts[r.id];
            if (ta && d && hasContent(d)) saveReply(r.id); // quick reply / text -> send even if text empty
            else focusComposer(r.id);
            e.preventDefault();
          }
        } else {
          const open = openThreads();
          if (!open.length) return;
          const cur = () => open[Math.max(0, Math.min(selIndex, open.length - 1))];
          if (e.key === 'k') { selIndex = Math.min(selIndex + 1, open.length - 1); render(); scrollSelIntoView(); e.preventDefault(); }   // k = next/down
          else if (e.key === 'j') { selIndex = Math.max(selIndex - 1, 0); render(); scrollSelIntoView(); e.preventDefault(); }            // j = prev/up
          else if (e.key === 'r') { const th = cur(); if (th) toggleResolve(th.id); e.preventDefault(); }
          else if (e.key === 'Enter' || e.key === 'e') { const th = cur(); if (th) openThread(th.id); e.preventDefault(); }
        }
      }

      // ---- init ----
      loadPersisted();
      $('newNotes').value = notes;
      $('newNotes').addEventListener('input', () => { notes = $('newNotes').value; persistNotes(); updateSubmitZone(); });
      $('submitBtn').onclick = submit;
      syncSoundBtn();
      $('soundBtn').onclick = () => { soundOn = !soundOn; localStorage.setItem(SND_KEY, soundOn ? '1' : '0'); syncSoundBtn(); unlockAudio(); if (soundOn) beep(); };
      // Unlock audio on the first user interaction so later agent-triggered beeps
      // (fired from SSE events, not clicks) actually play. Needed because the bell
      // is remembered across reloads but the browser re-locks audio each page-load.
      window.addEventListener('pointerdown', unlockAudio);
      window.addEventListener('keydown', unlockAudio);
      syncFileRootBtn();
      $('fileRootBtn').onclick = () => {
        const cur = fileRoot || (state && state.key) || '';
        const v = prompt('Open file links under this directory (absolute path). Leave blank to use the board default:', cur);
        if (v === null) return;
        fileRoot = v.trim().replace(/\/+$/, '');
        localStorage.setItem(FILEROOT_KEY, fileRoot);
        syncFileRootBtn();
        toast('File links now open under: ' + (fileRoot || (state && state.key) || '(board default)'));
      };
      window.addEventListener('hashchange', render);
      document.addEventListener('keydown', onKey);
      // markdown file links: intercept and open in the editor (VS Code)
      document.addEventListener('click', (e) => {
        const a = e.target.closest && e.target.closest('a.file-link');
        if (!a) return;
        e.preventDefault();
        const raw = a.getAttribute('data-file') || '';
        if (raw) handleFileLink(raw);
      });
      render();
      refresh();
      connect();
    </script>
  </body>
</html>
